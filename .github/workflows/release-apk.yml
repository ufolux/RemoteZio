name: Release APK

# Run by hand from the Actions tab: builds the Android app and publishes it
# as a (non-draft) GitHub release with the APK attached.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.0.1 (the release tag becomes v1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.1.0" "platforms;android-36" > /dev/null

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          else
            # No key stored: sign with a throwaway key. Phones that have a build signed
            # with another key must uninstall it before installing this one.
            echo "::warning::KEYSTORE_BASE64 secret not set; signing with a temporary key"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -storepass android -keypass android \
              -alias tvremote -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=RemoteZio" > /dev/null
          fi

      - name: Build APK
        env:
          VERSION_NAME: ${{ inputs.version }}
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE: ${{ runner.temp }}/release.keystore
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || 'android' }}
        run: |
          ANDROID_SDK="$ANDROID_HOME" sh android/build.sh
          mv android/TVRemote.apk "RemoteZio-${{ inputs.version }}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" "RemoteZio-${{ inputs.version }}.apk" \
            --title "RemoteZio ${{ inputs.version }}" --generate-notes --target "$GITHUB_SHA"
